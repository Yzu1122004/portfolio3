<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入</title>
    <link rel="stylesheet" href="./css/login.css">
    <style>
        
    </style>
</head>

<body>
    <div class="space"></div>
    <div class="container">
        <!-- 左邊區塊 -->
        <div class="card card-left">
            <a class="back-button" href="./index.html">← 返回首頁</a>

            <!-- 這個 divcontent 會根據登入/註冊模式切換內容 -->
            <div class="divcontent" id="left-content">
                <h2>歡迎</h2>
                <p>還沒註冊過?</p>
                <button class="register-button" id="toggle-button">註冊?</button>
            </div>
        </div>

        <!-- 中間區塊 -->
        <div class="card card-middle" id="middle-card">
            <!-- 這裡預設是「登入」表單 -->
            <h2>登入</h2>
            <input type="text" placeholder="使用者名稱/帳號" />
            <input type="password" placeholder="密碼" />
            <button class="login-button">登入</button>
        </div>

        <!-- 右邊區塊 -->
        <div class="card card-right">
            <div class="icon-placeholder">👁️‍🗨️</div>
        </div>
    </div>
    <div class="space"></div>

    <!-- 在檔案底部放一段 script，負責切換登入/註冊模式 -->
    <script src="./js/loging.js"></script>
</body>

</html>
